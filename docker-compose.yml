name: banco

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-banco}
      POSTGRES_USER: ${POSTGRES_USER:-banco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-banco}
      TZ: UTC
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    image: banco-api:latest
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-banco}
      DB_USER: ${POSTGRES_USER:-banco}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-banco}
      BANCO_LIMITE_DIARIO_RETIRO: ${BANCO_LIMITE_DIARIO_RETIRO:-1000.00}
      BANCO_ZONA_HORARIA: ${BANCO_ZONA_HORARIA:-America/Guayaquil}
      BANCO_CORS_ORIGINS: http://localhost:${WEB_PORT:-4200},http://localhost:4200
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    image: banco-web:latest
    ports:
      - "${WEB_PORT:-4200}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
